name: Build APK
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install
        run: npm install
      - name: Copy index.html to www
        run: |
          mkdir -p www
          cp index.html www/index.html
          for f in *.mp4 *.png *.jpg *.mp3 *.ogg *.js; do [ -f "$f" ] && [ "$f" != icon.png ] && cp "$f" www/ || true; done
      - name: Add Android project
        run: npx cap add android
      - name: Landscape + fullscreen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="sensorLandscape"|' $M
          S=android/app/src/main/res/values/styles.xml
          sed -i 's|</style>|<item name="android:windowFullscreen">true</item></style>|g' $S
      - name: Icon (optional)
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets && cp icon.png assets/icon-only.png
            if [ -f icon-fg.png ]; then cp icon-fg.png assets/icon-foreground.png; else cp icon.png assets/icon-foreground.png; fi
            npx capacitor-assets generate --android --iconBackgroundColor '#5a2e23' || true
          fi
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk game.apk
      - uses: actions/upload-artifact@v4
        with: { name: game-apk, path: game.apk }
      - name: Release (only on tags like v1)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: game.apk }
